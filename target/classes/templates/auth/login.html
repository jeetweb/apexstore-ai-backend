<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign In')}"></head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

<header th:replace="~{fragments/header :: navbar}"></header>

<main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-md w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/30 mb-3">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Sign In to ApexStore</h1>
            <p class="text-xs text-slate-500 mt-1">Access your cart, order history, and digital checkout</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${param.error}" class="p-3.5 text-xs text-rose-800 rounded-2xl bg-rose-50 border border-rose-200 flex items-center">
            <i class="fa-solid fa-circle-exclamation text-base mr-2.5 text-rose-500"></i>
            <span>Invalid username or password. Please try again.</span>
        </div>
        <div th:if="${param.logout}" class="p-3.5 text-xs text-indigo-800 rounded-2xl bg-indigo-50 border border-indigo-200 flex items-center">
            <i class="fa-solid fa-circle-check text-base mr-2.5 text-indigo-500"></i>
            <span>You have been signed out successfully.</span>
        </div>
        <div th:if="${successMessage}" class="p-3.5 text-xs text-emerald-800 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center">
            <i class="fa-solid fa-circle-check text-base mr-2.5 text-emerald-500"></i>
            <span th:text="${successMessage}">Success</span>
        </div>

        <!-- Quick 1-Click Demo Profiles -->
        <div class="p-4 rounded-2xl bg-gradient-to-br from-indigo-50/70 to-slate-100 border border-indigo-100/80">
            <div class="text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>⚡ 1-Click Demo Logins</span>
                <span class="text-slate-400 font-normal">Pre-configured accounts</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="fillCredentials('john', 'password123')"
                        class="p-2.5 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl text-left transition shadow-xs">
                    <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                        <span>John Doe</span>
                        <span class="text-[9px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-semibold">Customer</span>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono mt-0.5">john / password123</div>
                </button>

                <button type="button" onclick="fillCredentials('admin', 'admin123')"
                        class="p-2.5 bg-white hover:bg-amber-50 border border-slate-200 hover:border-amber-300 rounded-xl text-left transition shadow-xs">
                    <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                        <span>Store Admin</span>
                        <span class="text-[9px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-semibold">Admin</span>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono mt-0.5">admin / admin123</div>
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <form th:action="@{/login}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <input type="text" name="username" id="usernameInput" required placeholder="Enter username"
                               class="w-full px-4 py-2.5 pl-10 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        <i class="fa-regular fa-user absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="passwordInput" required placeholder="••••••••"
                               class="w-full px-4 py-2.5 pl-10 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        <i class="fa-solid fa-key absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-600/20 transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <span>Sign In</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Register Link -->
        <div class="text-center text-xs text-slate-500">
            Don't have an account yet?
            <a href="/register" class="font-bold text-indigo-600 hover:text-indigo-800 underline ml-1">Create an account</a>
        </div>

    </div>
</main>

<script>
    function fillCredentials(user, pass) {
        document.getElementById('usernameInput').value = user;
        document.getElementById('passwordInput').value = pass;
    }
</script>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
