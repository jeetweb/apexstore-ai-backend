<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${isEdit} ? 'Edit Product' : 'Add New Product')}"></head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

<header th:replace="~{fragments/header :: navbar}"></header>

<main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <!-- Breadcrumbs -->
    <nav class="flex text-xs text-slate-500 mb-6" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2">
            <li><a href="/" class="hover:text-indigo-600">Home</a></li>
            <li><i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i></li>
            <li><a href="/admin" class="hover:text-indigo-600">Admin</a></li>
            <li><i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i></li>
            <li><a href="/admin/inventory" class="hover:text-indigo-600">Inventory</a></li>
            <li><i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i></li>
            <li class="font-medium text-slate-800" th:text="${isEdit} ? 'Edit Product' : 'New Product'">Product</li>
        </ol>
    </nav>

    <!-- Header -->
    <div class="flex items-center justify-between pb-6 border-b border-slate-200">
        <div>
            <div class="flex items-center space-x-2">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-indigo-100 text-indigo-800"
                      th:text="${isEdit} ? 'Edit Mode' : 'Catalog Creation'">Mode</span>
                <span class="text-xs text-slate-400">Admin Inventory System</span>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-1"
                th:text="${isEdit} ? 'Edit Product: ' + ${productDto.name} : 'Create New Product'">Create Product</h1>
        </div>

        <a href="/admin/inventory" class="px-4 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold rounded-xl text-xs transition flex items-center space-x-2">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Cancel</span>
        </a>
    </div>

    <!-- Form Container -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 mt-6">
        <form th:action="${isEdit} ? @{'/admin/products/edit/' + ${productDto.id}} : @{/admin/products/new}"
              th:object="${productDto}" method="POST" class="space-y-6">

            <!-- Basic Details -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Product Name -->
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Product Name *</label>
                    <input type="text" th:field="*{name}" required placeholder="e.g. Apex Pro UltraBook 16&quot;"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- SKU -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Stock Keeping Unit (SKU) *</label>
                    <input type="text" th:field="*{sku}" required placeholder="e.g. LAP-APX-16"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Category *</label>
                    <select th:field="*{categoryId}" required
                            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        <option value="" disabled selected>Select a category</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Electronics</option>
                    </select>
                    <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Price -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Price ($ USD) *</label>
                    <div class="relative">
                        <span class="absolute left-4 top-2.5 text-slate-400 font-bold">$</span>
                        <input type="number" step="0.01" min="0.01" th:field="*{price}" required placeholder="299.99"
                               class="w-full pl-8 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Image URL -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Image URL</label>
                    <input type="url" th:field="*{imageUrl}" placeholder="https://images.unsplash.com/..."
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Stock Quantity -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Initial Stock Quantity *</label>
                    <input type="number" min="0" th:field="*{stockQuantity}" required placeholder="10"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Low Stock Threshold -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Low Stock Alert Threshold</label>
                    <input type="number" min="1" th:field="*{lowStockThreshold}" placeholder="5"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('lowStockThreshold')}" th:errors="*{lowStockThreshold}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Description -->
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Product Description</label>
                    <textarea th:field="*{description}" rows="4" placeholder="Detailed technical specifications, features, and user highlights..."
                              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"></textarea>
                    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <!-- Active Toggle -->
                <div class="sm:col-span-2 flex items-center space-x-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <input type="checkbox" th:field="*{active}" id="activeCheckbox"
                           class="w-5 h-5 text-indigo-600 rounded-lg border-slate-300 focus:ring-indigo-500">
                    <label for="activeCheckbox" class="text-xs font-bold text-slate-800 cursor-pointer">
                        Active in Store Catalog (available for browsing and purchasing)
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-6 border-t border-slate-100 flex items-center justify-end space-x-3">
                <a href="/admin/inventory" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs transition">
                    Cancel
                </a>
                <button type="submit"
                        class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs transition shadow-md shadow-indigo-600/20 flex items-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span th:text="${isEdit} ? 'Save Product Changes' : 'Create Product'">Save</span>
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
