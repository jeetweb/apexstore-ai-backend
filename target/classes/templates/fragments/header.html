<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | ApexStore' : 'ApexStore - Next-Gen E-Commerce'}">ApexStore</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body>

<header th:fragment="navbar" class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">
    <!-- Top Announcement Bar -->
    <div class="bg-slate-900 text-slate-300 text-xs py-2 px-4 text-center flex items-center justify-between">
        <div class="hidden sm:flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Java 21 Spring Boot E-Commerce System Active</span>
        </div>
        <div class="mx-auto sm:mx-0 font-medium text-white">
            <i class="fa-solid fa-truck-fast text-indigo-400 mr-1"></i> FREE Express Shipping on orders over $50
        </div>
        <div class="hidden md:flex items-center space-x-3 text-slate-400">
            <span><i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i> Secure Digital Payments (Card, UPI, Apple Pay)</span>
            <a href="/swagger-ui.html" target="_blank" class="text-indigo-400 hover:text-indigo-300 transition underline">API Docs</a>
        </div>
    </div>

    <!-- Main Navigation Bar -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Brand Logo -->
            <a href="/" class="flex items-center space-x-2 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-bolt-lightning text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900">Apex<span class="text-indigo-600">Store</span></span>
                    <span class="block text-[10px] uppercase font-bold tracking-widest text-slate-600 -mt-1">Java 21 Digital</span>
                </div>
            </a>

            <!-- Search Form with Vector AI toggle -->
            <div class="hidden md:flex flex-1 max-w-md mx-8 items-center space-x-2">
                <form action="/products" method="GET" class="w-full relative">
                    <input type="text" name="query" th:value="${searchQuery}" placeholder="Search products, headphones, laptops..."
                           class="w-full bg-slate-100 border border-slate-200 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                </form>
                <a href="/ai/search" title="Natural Language Semantic Vector Search"
                   class="px-3 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-full text-xs font-bold whitespace-nowrap shadow-sm hover:opacity-95 transition flex items-center space-x-1">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-xs"></i>
                    <span>AI Search</span>
                </a>
            </div>

            <!-- Navigation Links & User Actions -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <!-- Catalog Link -->
                <a href="/products" class="text-sm font-semibold text-slate-700 hover:text-indigo-600 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
                    <i class="fa-solid fa-grip mr-1 text-slate-400"></i> Catalog
                </a>

                <!-- Admin Link (if Admin) -->
                <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/admin"
                   class="inline-flex items-center text-sm font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-gauge-high mr-1 text-amber-600"></i> Admin
                </a>

                <!-- Cart Button with Counter Badge -->
                <a href="/cart" class="relative p-2 text-slate-700 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span th:if="${cartItemCount > 0}"
                          th:text="${cartItemCount}"
                          class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md animate-pulse">
                        0
                    </span>
                </a>

                <!-- User Account Actions -->
                <div sec:authorize="isAuthenticated()" class="flex items-center space-x-2">
                    <a href="/orders" class="hidden sm:inline-flex text-sm font-medium text-slate-700 hover:text-indigo-600 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
                        <i class="fa-solid fa-box mr-1 text-slate-400"></i> Orders
                    </a>

                    <div class="relative group">
                        <a href="/profile" class="flex items-center space-x-2 p-1.5 rounded-xl hover:bg-slate-100 transition">
                            <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs">
                                <span th:text="${#strings.substring(currentUser.fullName != null ? currentUser.fullName : currentUser.username, 0, 1)}">U</span>
                            </div>
                            <span class="hidden md:inline text-xs font-semibold text-slate-800" th:text="${currentUser.fullName != null ? currentUser.fullName : currentUser.username}">User</span>
                        </a>
                    </div>

                    <form th:action="@{/logout}" method="POST" class="inline">
                        <button type="submit" title="Logout" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition text-sm">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </form>
                </div>

                <div sec:authorize="!isAuthenticated()" class="flex items-center space-x-2">
                    <a href="/login" class="text-sm font-semibold text-slate-700 hover:text-indigo-600 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
                        Sign In
                    </a>
                    <a href="/register" class="text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-3.5 py-2 rounded-xl shadow-sm shadow-indigo-500/20 transition">
                        Sign Up
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Sub-Nav Strip -->
    <div class="bg-slate-50/80 border-t border-slate-100 px-4 sm:px-6 overflow-x-auto py-2">
        <div class="max-w-7xl mx-auto flex items-center space-x-3 text-xs">
            <span class="text-slate-400 font-semibold uppercase tracking-wider text-[10px]">Categories:</span>
            <a href="/products"
               class="px-2.5 py-1 rounded-full font-medium transition"
               th:classappend="${selectedCategory == null} ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'">
                All Products
            </a>
            <th:block th:each="cat : ${navCategories}">
                <a th:href="@{/products(category=${cat.slug})}"
                   th:text="${cat.name}"
                   class="px-2.5 py-1 rounded-full font-medium whitespace-nowrap transition"
                   th:classappend="${selectedCategory == cat.slug} ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'">
                    Category
                </a>
            </th:block>
        </div>
    </div>
</header>

</body>
</html>
