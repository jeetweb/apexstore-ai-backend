<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Create Account')}"></head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

<header th:replace="~{fragments/header :: navbar}"></header>

<main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-md w-full space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/30 mb-3">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create Customer Account</h1>
            <p class="text-xs text-slate-500 mt-1">Get instant access to digital checkout, orders & live tracking</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
            <form th:action="@{/register}" th:object="${registerRequest}" method="POST" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name *</label>
                    <input type="text" th:field="*{fullName}" required placeholder="Alex Johnson"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username *</label>
                    <input type="text" th:field="*{username}" required placeholder="alexj"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address *</label>
                    <input type="email" th:field="*{email}" required placeholder="alex@example.com"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password *</label>
                    <input type="password" th:field="*{password}" required placeholder="At least 6 characters"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-rose-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Phone Number (Optional)</label>
                    <input type="tel" th:field="*{phone}" placeholder="+1 (555) 000-0000"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-600/20 transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-user-check"></i>
                        <span>Create Account</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Login Link -->
        <div class="text-center text-xs text-slate-500">
            Already have an account?
            <a href="/login" class="font-bold text-indigo-600 hover:text-indigo-800 underline ml-1">Sign in here</a>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
