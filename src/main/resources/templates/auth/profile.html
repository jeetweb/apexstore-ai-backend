<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Profile')}"></head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

<header th:replace="~{fragments/header :: navbar}"></header>

<main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <!-- Breadcrumbs -->
    <nav class="flex text-xs text-slate-500 mb-6" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2">
            <li><a href="/" class="hover:text-indigo-600">Home</a></li>
            <li><i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i></li>
            <li class="font-medium text-slate-800">My Account Profile</li>
        </ol>
    </nav>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-10">
        <div class="flex items-center space-x-4 pb-6 border-b border-slate-100">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl font-black shadow-md shadow-indigo-500/20">
                <span th:text="${#strings.substring(user.fullName != null ? user.fullName : user.username, 0, 1)}">U</span>
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-900" th:text="${user.fullName}">User Full Name</h1>
                <div class="flex items-center space-x-2 text-xs text-slate-500 mt-1">
                    <span class="font-mono" th:text="'@' + ${user.username}">@username</span>
                    <span>&bull;</span>
                    <span class="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-bold" th:text="${user.role}">ROLE_CUSTOMER</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6 text-xs">
            <div>
                <span class="text-slate-400 font-medium">Email Address:</span>
                <div class="text-sm font-semibold text-slate-800 mt-1" th:text="${user.email}">user@example.com</div>
            </div>
            <div>
                <span class="text-slate-400 font-medium">Phone Number:</span>
                <div class="text-sm font-semibold text-slate-800 mt-1" th:text="${user.phone != null ? user.phone : 'Not provided'}">+1 (555) 000-0000</div>
            </div>
            <div class="sm:col-span-2">
                <span class="text-slate-400 font-medium">Default Delivery Address:</span>
                <div class="text-sm font-semibold text-slate-800 mt-1 p-3.5 bg-slate-50 rounded-xl border border-slate-200/80">
                    <span th:if="${user.defaultAddress != null}" th:text="${user.defaultAddress.getFormatted()}">Address line</span>
                    <span th:if="${user.defaultAddress == null}" class="text-slate-400 italic">No saved address yet. It will automatically save during your first checkout.</span>
                </div>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between">
            <a href="/orders" class="inline-flex items-center px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl text-xs font-bold transition">
                <i class="fa-solid fa-box mr-1.5"></i> View Order History (<span th:text="${orders.size()}">0</span>)
            </a>
            <a href="/products" class="text-xs font-semibold text-slate-600 hover:text-indigo-600">
                Continue Shopping &rarr;
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
